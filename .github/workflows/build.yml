name: build

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Install pmbootstrap + build toolchain (native aarch64 via qemu-user)
        run: |
          set -euo pipefail
          python3 -m venv /tmp/pmbvenv
          source /tmp/pmbvenv/bin/activate
          git clone -q --depth 1 \
            https://gitlab.postmarketos.org/postmarketOS/pmbootstrap.git \
            /tmp/pmbootstrap
          pip install -q -e /tmp/pmbootstrap
          sudo apt-get update -qq
          sudo apt-get install -y -qq git python3-pip patch pkgconf openssl \
            rsync sudo qemu-user qemu-user-static binfmt-support
          echo "export PATH=/tmp/pmbvenv/bin:$PATH" >> "$GITHUB_ENV"

      - name: Clone pmaports (pmbootstrap wants a real aports dir)
        run: |
          set -euo pipefail
          git clone -q --depth 1 https://gitlab.postmarketos.org/postmarketOS/pmaports.git /tmp/pmaports
          cp -r postcast /tmp/pmaports/testing/
          mkdir -p /tmp/pmaports/testing/postcast
          cp APKBUILD /tmp/pmaports/testing/postcast/APKBUILD
          cp data/io.postcast.Postcast.svg /tmp/pmaports/testing/postcast/
          cp data/io.postcast.Postcast.desktop /tmp/pmaports/testing/postcast/
          cp data/io.postcast.Postcast.metainfo.xml /tmp/pmaports/testing/postcast/
          mkdir -p /tmp/postcast-src/postcast-0.1.3
          cp -r postcast data setup.py /tmp/postcast-src/postcast-0.1.3/
          tar -C /tmp/postcast-src -czf \
            /tmp/pmaports/testing/postcast/postcast-0.1.3.tar.gz postcast-0.1.3

      - name: Set up ssh/gnupg for apk signing
        run: |
          mkdir -p ~/.ssh ~/.gnupg
          chmod 700 ~/.ssh ~/.gnupg

      - name: pmbootstrap init (non-interactive, aarch64, our own pmaports)
        run: |
          set -euo pipefail
          source /tmp/pmbvenv/bin/activate
          # The package build does not need a device-specific init. Generate the
          # current v3 config with safe defaults, then select the target arch at
          # build time below.
          set +o pipefail
          yes '' | pmbootstrap -p /tmp/pmaports -w /tmp/pmbwork init
          init_status=${PIPESTATUS[1]}
          set -o pipefail
          test "$init_status" -eq 0
          pmbootstrap -p /tmp/pmaports -w /tmp/pmbwork config aports /tmp/pmaports
          pmbootstrap --version

      - name: Build postcast apk
        run: |
          set -euo pipefail
          source /tmp/pmbvenv/bin/activate
          cd /tmp/pmaports/testing/postcast
          pmbootstrap -p /tmp/pmaports -w /tmp/pmbwork checksum postcast
          if ! pmbootstrap -p /tmp/pmaports -w /tmp/pmbwork build --arch aarch64 --force postcast; then
            echo "===== pmbootstrap build log ====="
            pmbootstrap -p /tmp/pmaports -w /tmp/pmbwork log || true
            exit 1
          fi

      - name: Locate and upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: postcast-apk
          path: |
            /tmp/pmbwork/packages/**/*.apk

      - name: Create GitHub release with the apk
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          name: Postcast v0.1.3
          tag_name: v0.1.3
          files: /tmp/pmbwork/packages/**/*.apk
          draft: true
