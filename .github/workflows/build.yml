name: build

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Install pmbootstrap + build toolchain (native aarch64 via qemu-user)
        run: |
          set -euo pipefail
          python3 -m venv /tmp/pmbvenv
          source /tmp/pmbvenv/bin/activate
          git clone -q --depth 1 \
            https://gitlab.postmarketos.org/postmarketOS/pmbootstrap.git \
            /tmp/pmbootstrap
          pip install -q -e /tmp/pmbootstrap
          sudo apt-get update -qq
          sudo apt-get install -y -qq git python3-pip patch pkgconf openssl \
            rsync sudo qemu-user qemu-user-static binfmt-support
          echo "export PATH=/tmp/pmbvenv/bin:$PATH" >> "$GITHUB_ENV"

      - name: Clone pmaports (pmbootstrap wants a real aports dir)
        run: |
          set -euo pipefail
          git clone -q --depth 1 https://gitlab.postmarketos.org/postmarketOS/pmaports.git /tmp/pmaports
          cp -r postcast /tmp/pmaports/testing/
          mkdir -p /tmp/pmaports/testing/postcast
          cp APKBUILD /tmp/pmaports/testing/postcast/APKBUILD
          cp data/io.postcast.Postcast.svg /tmp/pmaports/testing/postcast/
          cp data/io.postcast.Postcast.desktop /tmp/pmaports/testing/postcast/
          cp data/io.postcast.Postcast.metainfo.xml /tmp/pmaports/testing/postcast/
          tar -C postcast -czf /tmp/pmaports/testing/postcast/postcast-0.1.1.tar.gz \
            --transform "s|^|postcast-0.1.1/|" . 2>/dev/null || \
            tar -C . -czf /tmp/pmaports/testing/postcast/postcast-0.1.1.tar.gz postcast-0.1.1

      - name: Set up ssh/gnupg for apk signing
        run: |
          mkdir -p ~/.ssh ~/.gnupg
          chmod 700 ~/.ssh ~/.gnupg

      - name: pmbootstrap init (non-interactive, aarch64, our own pmaports)
        env:
          DEVICE: oneplus-fajita
        run: |
          set -euo pipefail
          source /tmp/pmbvenv/bin/activate
          # Answer init prompts: Channel(enter), Vendor(oneplus), Device(fajita), then defaults
          printf '\n\noneplus\nfajita\n\n\n\n\n\n\n\n\n\n\n' | pmbootstrap init || true
          pmbootstrap config aports /tmp/pmaports
          pmbootstrap --version

      - name: Build postcast apk
        run: |
          set -euo pipefail
          source /tmp/pmbvenv/bin/activate
          cd /tmp/pmaports/testing/postcast
          pmbootstrap --aports /tmp/pmaports checksum postcast
          pmbootstrap --aports /tmp/pmaports build postcast
          pmbootstrap --aports /tmp/pmaports build postcast --force || true

      - name: Locate and upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: postcast-apk
          path: |
            /tmp/pmbwork/packages/**/*.apk

      - name: Create GitHub release with the apk
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: /tmp/pmbwork/packages/**/*.apk
          draft: true